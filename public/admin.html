<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102f4f">
  <title>BIOB90 Rubric Dashboard</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="eyebrow">BIOB90 · Organizer access</div>
      <h1>Rubric Dashboard</h1>
      <p>Review and export poster feedback</p>
    </div>
  </header>
  <main class="page-shell">
    <section id="admin-login" class="panel intro-panel admin-login">
      <span class="step-label">Protected area</span>
      <h2>Organizer sign in</h2>
      <p>Enter the admin password configured in Railway.</p>
      <form id="login-form">
        <input id="admin-password" type="password" autocomplete="current-password" aria-label="Admin password" required>
        <button class="primary-button" type="submit">Open dashboard</button>
      </form>
      <p id="login-error" class="error-message" role="alert"></p>
    </section>

    <section id="dashboard" hidden>
      <div class="dashboard-head">
        <div><span class="step-label">Stored results</span><h2>Judge submissions</h2></div>
        <div class="admin-header-actions">
          <button id="export-button" class="secondary-button" type="button">Export CSV</button>
          <button id="logout-button" class="text-button" type="button">Sign out</button>
        </div>
      </div>
      <div class="summary-grid">
        <div class="panel summary-card"><span>Submitted reviews</span><strong id="submitted-count">0</strong></div>
        <div class="panel summary-card"><span>Posters reviewed</span><strong id="poster-count">0</strong></div>
        <div class="panel summary-card"><span>Average Yes score</span><strong id="average-score">—</strong></div>
      </div>
      <div class="panel table-panel"><div id="results-table" class="table-wrap"></div></div>
      <p id="dashboard-error" class="error-message" role="alert"></p>
    </section>
  </main>
  <footer><a href="/">Return to judging rubric</a></footer>
  <script src="/admin.js" defer></script>
</body>
</html>
